<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline Mode</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px;
        }

        h1 {
            color: red;
        }

        .container {
            max-width: 500px;
            margin: auto;
        }

        .alert {
            color: red;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>You're Offline</h1>
        <p>Some features are unavailable. You need an internet connection to log in.</p>
        <p class="alert">Please check your connection and try again.</p>
    </div>
</body>

</html>
